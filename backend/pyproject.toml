[project]
name = "orderflow-backend"
version = "0.1.0"
description = "OrderFlow MVP backend: multi-tenant purchase order & dispatch tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "stripe>=11.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` default-argument idiom is intentional, not a bug.
# DTZ011: `date.today()` is correct here — PO/dispatch dates are calendar dates
# compared against other calendar dates, not timestamps needing tz-awareness.
ignore = ["B008", "DTZ011"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
