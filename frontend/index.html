<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrderFlow — Purchase order & dispatch tracking</title>
    <meta
      name="description"
      content="Track purchase orders and partial dispatches live. OrderFlow keeps remaining balances accurate in real time for trading companies and material dealers."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OrderFlow" />
    <meta property="og:title" content="OrderFlow — Purchase order & dispatch tracking" />
    <meta
      property="og:description"
      content="Track purchase orders and partial dispatches live. OrderFlow keeps remaining balances accurate in real time for trading companies and material dealers."
    />
    <!-- Raster, not SVG: most link unfurlers (Slack, WhatsApp) will not render
         an SVG, which is where these links actually get forwarded. Composed
         from the hero screenshot by the landing capture; see
         specs/003-landing-page-upgrade/research.md R6. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An OrderFlow purchase order showing Ordered 1,000, Dispatched 400 and Remaining 600."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem("orderflow_theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored ? stored === "dark" : prefersDark;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
